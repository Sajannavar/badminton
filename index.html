<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1e2a3f">
<title>🏸 My Badminton</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Badminton">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  body { margin:0; background:#f4f1ea; color:#1f2a37; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .sh-boot { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center;
    background:radial-gradient(900px 500px at 50% 30%, #243449 0%, #16202E 72%); color:#fff; font-size:15px; }
  .sh-boot.err { background:#f4f1ea; color:#B0140A; }
  .sh-court { position:relative; width:240px; height:130px; }
  .sh-net { position:absolute; left:50%; bottom:0; width:3px; height:48px; margin-left:-1.5px; border-radius:2px; background:repeating-linear-gradient(to bottom, rgba(255,255,255,.85) 0 3px, rgba(255,255,255,.25) 3px 6px); }
  .sh-net::after { content:''; position:absolute; left:-60px; right:-60px; bottom:-2px; height:2px; background:rgba(255,255,255,.18); border-radius:2px; }
  .sh-rally { position:absolute; left:50%; top:0; width:52px; height:52px; margin-left:-26px; animation:rx 1.6s ease-in-out infinite alternate; }
  .sh-rally svg { width:100%; height:100%; transform-origin:50% 60%; animation:ry .8s cubic-bezier(.3,0,.7,1) infinite alternate, rt 1.6s ease-in-out infinite alternate; }
  @keyframes rx { from { transform:translateX(-95px); } to { transform:translateX(95px); } }
  @keyframes ry { from { translate:0 66px; } to { translate:0 0; } }
  @keyframes rt { from { rotate:-70deg; } to { rotate:70deg; } }
  .sh-bar { width:170px; height:4px; border-radius:4px; background:rgba(255,255,255,.12); overflow:hidden; }
  .sh-bar i { display:block; height:100%; width:40%; border-radius:4px; background:linear-gradient(90deg,#F2B705,#FFD54F); animation:bb 1.3s ease-in-out infinite; }
  @keyframes bb { 0% { transform:translateX(-110%); } 100% { transform:translateX(260%); } }
  .sh-msg { font-weight:700; letter-spacing:.3px; opacity:.9; }
  @media (prefers-reduced-motion: reduce) { .sh-rally, .sh-rally svg, .sh-bar i { animation:none; } }
</style>
</head>
<body>
<div id="app"><div class="sh-boot" role="status"><div class="sh-court"><div class="sh-rally"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 6 L50 6 L39 40 L25 40 Z" fill="#DDE9F5"/><g stroke="#01579B" stroke-width="2.2" stroke-linecap="round"><path d="M14 6 L25 40"/><path d="M23 6 L28.5 40"/><path d="M32 6 L32 40"/><path d="M41 6 L35.5 40"/><path d="M50 6 L39 40"/><path d="M16.5 16 L47.5 16"/><path d="M20 28 L44 28"/><path d="M14 6 L50 6"/></g><path d="M24 40 h16 v4 a8 8 0 0 1 -16 0 Z" fill="#F2B705"/></svg></div><div class="sh-net"></div></div><div class="sh-msg">Opening your page…</div><div class="sh-bar"><i></i></div></div></div>
<script>
/*
 * Player page shell (ARCHITECTURE.md §119). This file never changes: it
 * loads the real page from the club's Apps Script (so updates ship with the
 * normal deploy) and talks to it through a small JSON API. Hosting it here
 * instead of on script.google.com removes Google's "created by a Google Apps
 * Script user" banner.
 * The link is  …/#t=<token>  — the part after # never leaves the phone,
 * so the host never sees anyone's token.
 */
var API = 'https://script.google.com/macros/s/AKfycbwa8rz3l1Qpbhz8o4kQC6lu3uoeOs01cuWexfLgkbDPhfPyR9SCKR5h4l_JmYw4JpfCVQ/exec';
window.__PLAYER_SHELL = true;
// Installed-app support (§124): the install prompt (Android/Chrome) is kept
// for the page's "Install as an app" button, and the service worker makes
// the page installable.
window.addEventListener('beforeinstallprompt', function(e) { e.preventDefault(); window.__installPrompt = e; });
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function() { navigator.serviceWorker.register('sw.js').catch(function() { /* optional */ }); });
}
(function() {
  function tokenFromUrl() {
    var m = /(?:^|[#&?])t=([A-Za-z0-9]{24,128})(?:&|$)/.exec(location.hash) || /(?:^|[#&?])t=([A-Za-z0-9]{24,128})(?:&|$)/.exec(location.search);
    return m ? m[1] : '';
  }
  // The home-screen app opens at the start page with no #t=…, so the link
  // is remembered on this phone (the PIN is still needed to see anything).
  function rememberedToken() {
    var t = tokenFromUrl();
    try {
      if (t) localStorage.setItem('mb_token', t);
      else t = localStorage.getItem('mb_token') || '';
    } catch (e) { /* storage blocked */ }
    if (t && !tokenFromUrl()) { try { history.replaceState(null, '', '#t=' + t); } catch (e) { /* */ } }
    return /^[A-Za-z0-9]{24,128}$/.test(t) ? t : '';
  }

  function call(body) {
    // text/plain = a "simple" request, so no CORS preflight (Apps Script can't answer one).
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow', credentials: 'omit' })
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  // Stand-in for google.script.run, so the page runs here unchanged.
  function runner(ok, fail) {
    return new Proxy({}, { get: function(_, name) {
      if (name === 'withSuccessHandler') return function(f) { return runner(f, fail); };
      if (name === 'withFailureHandler') return function(f) { return runner(ok, f); };
      return function() {
        var args = Array.prototype.slice.call(arguments);
        // The first data request is already answered by the boot call.
        if (name === 'getPortalData' && boot && boot.data && args[0] === boot.token && (args[1] || {}).key === boot.key) {
          var ready = boot.data; boot = null;
          setTimeout(function() { if (ok) ok(ready); }, 0);
          return;
        }
        call({ fn: name, args: args }).then(function(res) {
          if (res && Object.prototype.hasOwnProperty.call(res, 'result')) { if (ok) ok(res.result); }
          else if (fail) fail(new Error((res && res.error) || 'Something went wrong.'));
        }, function(err) { if (fail) fail(err); });
      };
    } });
  }
  window.google = { script: { get run() { return runner(null, null); } } };

  function fail(msg) {
    var box = document.createElement('div'); box.className = 'sh-boot err';
    var icon = document.createElement('div'); icon.style.fontSize = '40px'; icon.textContent = '🏸';
    var p = document.createElement('div'); p.textContent = msg;
    box.appendChild(icon); box.appendChild(p);
    var app = document.getElementById('app'); app.innerHTML = ''; app.appendChild(box);
  }

  // Puts the page's styles, markup and scripts into this document (scripts
  // added via innerHTML don't run, so they are re-created in order).
  function mount(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    Array.prototype.forEach.call(doc.head.querySelectorAll('style'), function(s) { document.head.appendChild(document.importNode(s, true)); });
    var scripts = Array.prototype.slice.call(doc.body.querySelectorAll('script'));
    scripts.forEach(function(s) { s.parentNode.removeChild(s); });
    document.body.innerHTML = doc.body.innerHTML;
    scripts.forEach(function(s) { var n = document.createElement('script'); n.text = s.textContent; document.body.appendChild(n); });
  }

  if (API.indexOf('https://script.google.com/') !== 0) { fail('This page isn’t set up yet.'); return; }
  // One request brings both the page and the player's data (§127); an older
  // server that doesn't know "boot" still answers "page".
  var token = rememberedToken(), key = '';
  try { key = token ? localStorage.getItem('mb_key_' + token.slice(0, 12)) || '' : ''; } catch (e) { /* */ }
  var boot = null;
  call({ fn: 'boot', token: token, auth: { key: key } }).then(function(res) {
    if (res && res.html) { boot = { token: token, key: key, data: res.data || null }; return res; }
    return call({ fn: 'page', token: token });
  }).then(function(res) {
    if (!res || !res.html) throw new Error('no page');
    mount(res.html);
  }).catch(function() { fail('Couldn’t load — check your connection and try again.'); });
})();
</script>
</body>
</html>
