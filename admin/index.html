<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Moved</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f1ea;color:#1f2a37;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box}</style>
</head>
<body>
<p>The admin phone app has been removed. Taking you to the player page…</p>
<script>
/* Removed (ARCHITECTURE.md §140): forget its saved key, unregister its service worker, go to the player page. */
try { localStorage.removeItem('mb_admin_key'); localStorage.removeItem('mb_admin_alerts'); } catch (e) { /* */ }
(navigator.serviceWorker && navigator.serviceWorker.getRegistrations ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]))
  .then(function(regs) { return Promise.all(regs.filter(function(r) { return /\/admin\/$/.test(r.scope); }).map(function(r) { return r.unregister(); })); })
  .catch(function() {}).then(function() { location.replace('../'); });
</script>
</body>
</html>
