<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1e2a3f">
<title>🏸 Live cup</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root { --ink:#1f2a37; --muted:#5b6675; --line:#e3ddd0; --bg:#f4f1ea; --card:#fff; --brand:#01579B; --ok:#0D896A; --soft:#EEF3FB; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size:15px; }
  header { background:linear-gradient(135deg,#243449,#1d5a8e); color:#fff; padding:18px 16px 16px; }
  header .club { font-size:12px; letter-spacing:.8px; text-transform:uppercase; opacity:.8; }
  header h1 { margin:4px 0 6px; font-size:22px; line-height:1.2; }
  header .meta { font-size:13px; opacity:.9; }
  .pill { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:700; background:rgba(255,255,255,.18); margin-right:6px; }
  .pill.live { background:#F2B705; color:#1f2a37; }
  main { max-width:760px; margin:0 auto; padding:12px 16px 40px; }
  .card { background:var(--card); border-radius:16px; padding:14px 16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .card h2 { font-size:15px; margin:0 0 10px; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .card h2 small { font-weight:500; color:var(--muted); font-size:12px; }
  .champ { font-size:17px; font-weight:800; color:var(--ok); }
  .g { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line); }
  .g:first-of-type { border-top:0; }
  .g .where { min-width:76px; font-size:12px; font-weight:700; color:var(--muted); }
  .g .who { flex:1; min-width:0; line-height:1.35; }
  .g .vs { color:var(--muted); font-size:12px; margin:0 4px; }
  .g .sc { font-size:13px; color:var(--muted); white-space:nowrap; }
  .g .w { font-weight:800; color:var(--ok); }
  .now .g:first-of-type .where { color:var(--brand); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-size:11px; letter-spacing:.4px; text-transform:uppercase; color:var(--muted); padding:4px 4px; }
  td { padding:7px 4px; border-top:1px solid var(--line); }
  td.n, th.n { text-align:center; width:36px; }
  .tblh { font-weight:700; font-size:13px; margin:10px 0 2px; color:var(--brand); }
  .tblh:first-child { margin-top:0; }
  .foot { text-align:center; font-size:12px; color:var(--muted); margin-top:6px; }
  .btn { font:inherit; font-size:14px; font-weight:700; min-height:44px; padding:8px 18px; border-radius:12px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
  .empty { color:var(--muted); font-size:14px; }
  .err { padding:60px 20px; text-align:center; color:#B0140A; }
  details summary { cursor:pointer; font-weight:700; min-height:40px; display:flex; align-items:center; }
</style>
</head>
<body>
<div id="app"><div class="err" style="color:var(--muted)">Loading the cup…</div></div>
<script>
/*
 * Public live page for one cup (ARCHITECTURE.md §155). Link: …/live.html#c=<share key>.
 * Read-only: it asks the player page's liveCup() for the cup every 30 seconds
 * while it is on screen. No token, no PIN, no money; nothing is written.
 */
(function() {
  var API = 'https://script.google.com/macros/s/AKfycbwa8rz3l1Qpbhz8o4kQC6lu3uoeOs01cuWexfLgkbDPhfPyR9SCKR5h4l_JmYw4JpfCVQ/exec';
  var REFRESH_MS = 30000;
  var m = /(?:^|[#&?])c=([A-Za-z0-9]{24,64})(?:&|$)/.exec(location.hash) || /(?:^|[#&?])c=([A-Za-z0-9]{24,64})(?:&|$)/.exec(location.search);
  var key = m ? m[1] : '';
  var app = document.getElementById('app');
  var esc = function(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var timer = null, last = null;

  function call(body) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow', credentials: 'omit' })
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function fail(msg) { app.innerHTML = '<div class="err">' + esc(msg) + '</div>'; }

  function side(name, winner) { return name === winner ? '<span class="w">' + esc(name) + '</span>' : esc(name); }

  function render(c) {
    var live = c.status === 'Active';
    var h = '<header><div class="club">' + esc(c.club || '') + '</div><h1>🏆 ' + esc(c.name) + '</h1><div class="meta">' +
      (live ? '<span class="pill live">● Live</span>' : '<span class="pill">Finished</span>') +
      esc(c.format) + (c.total ? ' · ' + c.played + ' of ' + c.total + ' games played' : '') + '</div></header><main>';
    if (c.winner && !live) h += '<div class="card"><div class="champ">🏆 Champion: ' + esc(c.winner) + '</div></div>';
    if (live) {
      h += '<div class="card now"><h2>On now &amp; up next</h2>';
      h += (c.now || []).length ? c.now.map(function(g) {
        return '<div class="g"><div class="where">' + esc(g.court || g.round || '') + (g.time ? '<br>' + esc(g.time) : '') + '</div>' +
          '<div class="who">' + esc(g.a) + '<span class="vs">vs</span>' + esc(g.b) + '<div class="sc">' + esc(g.round || '') + '</div></div></div>';
      }).join('') : '<div class="empty">Nothing scheduled right now.</div>';
      h += '</div>';
    }
    (c.tables || []).forEach(function(t) {
      h += '<div class="card"><h2>' + esc(t.name === 'Players' ? 'Table' : t.name) + '</h2><table><tr><th class="n">#</th><th></th><th class="n">P</th><th class="n">W</th><th class="n">L</th><th class="n">+/−</th></tr>' +
        t.rows.map(function(r, i) { return '<tr><td class="n">' + (i + 1) + '</td><td>' + esc(r.name) + '</td><td class="n">' + r.p + '</td><td class="n">' + r.w + '</td><td class="n">' + r.l + '</td><td class="n">' + (r.diff > 0 ? '+' : '') + r.diff + '</td></tr>'; }).join('') +
        '</table></div>';
    });
    var results = [];
    (c.rounds || []).forEach(function(r) { r.matches.forEach(function(g) { if (g.status === 'Completed') results.push({ r: r.label, g: g }); }); });
    if (results.length) {
      h += '<div class="card"><h2>Results <small>latest first</small></h2>' + results.reverse().map(function(x) {
        return '<div class="g"><div class="where">' + esc(x.r) + '</div><div class="who">' + side(x.g.a, x.g.winner) + '<span class="vs">vs</span>' + side(x.g.b, x.g.winner) +
          '<div class="sc">' + esc(x.g.games || '') + '</div></div></div>';
      }).join('') + '</div>';
    }
    h += '<div class="foot">Updated ' + esc(c.updated || '') + (live ? ' · refreshes by itself' : '') + '</div>' +
      '<div class="foot"><button type="button" class="btn" id="refresh">↻ Refresh</button></div></main>';
    app.innerHTML = h;
    document.title = '🏸 ' + c.name;
    var b = document.getElementById('refresh'); if (b) b.onclick = function() { load(true); };
  }

  function load(manual) {
    if (document.hidden && !manual) return;
    call({ fn: 'liveCup', args: [key] }).then(function(res) {
      var r = res && res.result;
      if (!r || !r.success) { fail((r && r.message) || 'Couldn’t load the cup.'); return; }
      last = r.cup;
      render(r.cup);
      if (r.cup.status !== 'Active' && timer) { clearInterval(timer); timer = null; }
    }).catch(function() { if (!last) fail('Couldn’t load — check your connection and try again.'); });
  }

  if (API.indexOf('https://script.google.com/') !== 0) { fail('This page isn’t set up yet.'); return; }
  if (!key) { fail('This live link isn’t complete — ask the organiser to send it again.'); return; }
  load(true);
  timer = setInterval(load, REFRESH_MS);
  document.addEventListener('visibilitychange', function() { if (!document.hidden) load(true); });
})();
</script>
</body>
</html>
